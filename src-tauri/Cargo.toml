[package]
name = "lexidesk"
version = "0.1.0"
description = "LexiDesk - dicionário e vocabulário para estudo de idiomas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "lexidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
