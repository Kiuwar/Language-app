[package]
name = "lexidesk"
version = "0.1.0"
description = "LexiDesk - dicionário e vocabulário para estudo de idiomas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-full"] }
rusqlite_migration = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-global-shortcut = "2"
whatlang = "0.18"
mouse_position = "0.1"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[lib]
name = "lexidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
