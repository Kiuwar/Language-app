name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências
        run: npm ci

      - name: Build do instalador (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disponibilizar instalador para download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LexiDesk-Windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar instalador na Release (link fixo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || 'latest' }}
          name: ${{ github.event_name == 'push' && format('LexiDesk {0}', github.ref_name) || 'LexiDesk (build mais recente)' }}
          prerelease: ${{ github.event_name != 'push' }}
          body: |
            Instalador do LexiDesk para Windows.
            Baixe o `.exe` (ou `.msi`) abaixo, execute e instale — o instalador cria o atalho no Menu Iniciar para abrir o app depois.
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
